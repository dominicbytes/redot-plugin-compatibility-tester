name: Trusted Redot integration

on:
  workflow_dispatch:
    inputs:
      redot_url:
        description: Exact official Redot Windows ZIP URL
        default: https://github.com/Redot-Engine/redot-engine/releases/download/redot-26.3-stable/Redot_v26.3-stable_windows_win64.zip
        required: true
        type: string
      redot_sha256:
        description: Published lowercase SHA-256 for the ZIP
        default: 2c6c7b4e96a88ca44eb413d9a5d43b8468b60a346c2448854c1a0c6bc9baab76
        required: true
        type: string

permissions:
  contents: read

jobs:
  trusted-fixture:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.7"
          python-version: "3.12"
      - name: Sync frozen dependencies
        run: uv sync --frozen
      - name: Download and verify the exact engine archive
        shell: pwsh
        env:
          REDOT_URL: ${{ inputs.redot_url }}
          REDOT_SHA256: ${{ inputs.redot_sha256 }}
        run: |
          if ($env:REDOT_SHA256 -notmatch '^[a-f0-9]{64}$') { throw 'Invalid SHA-256 input' }
          Invoke-WebRequest -Uri $env:REDOT_URL -OutFile "$env:RUNNER_TEMP/redot.zip"
          $actual = (Get-FileHash "$env:RUNNER_TEMP/redot.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:REDOT_SHA256) { throw "Engine digest mismatch: $actual" }
          Expand-Archive "$env:RUNNER_TEMP/redot.zip" "$env:RUNNER_TEMP/redot"
      - name: Doctor engine and run only the frozen synthetic fixture
        shell: pwsh
        run: |
          $engines = @(Get-ChildItem "$env:RUNNER_TEMP/redot" -Recurse -Filter redot.windows.editor.x86_64.console.exe)
          if ($engines.Count -ne 1) { throw "Expected exactly one console editor" }
          $engine = $engines[0]
          uv run --frozen redot-compat doctor --redot $engine.FullName --output artifacts/doctor
          uv run --frozen redot-compat test tests/fixtures/baseline_gdscript_pass `
            --force-test-baseline --backend host --trusted-source `
            --allow-unsafe-host-execution --redot $engine.FullName --output artifacts/host-smoke
      - name: Run gated host and engine integration oracles
        if: always()
        shell: pwsh
        env:
          REDOT_SHA256: ${{ inputs.redot_sha256 }}
        run: |
          $engines = @(Get-ChildItem "$env:RUNNER_TEMP/redot" -Recurse -Filter redot.windows.editor.x86_64.console.exe)
          if ($engines.Count -ne 1) { throw "Expected exactly one console editor" }
          uv run --frozen pytest -q -m "gauntlet or integration" tests/gauntlet tests/integration `
            --integration-host --integration-redot $engines[0].FullName `
            --integration-redot-archive "$env:RUNNER_TEMP/redot.zip" `
            --integration-redot-archive-sha256 $env:REDOT_SHA256 `
            --junitxml=artifacts/integration.xml
      - name: Upload retained evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trusted-redot-evidence
          path: artifacts/
          if-no-files-found: error
