name: Release dry run

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
          python-version: "3.12"
      - name: Sync and run the quality gate
        run: |
          uv sync --frozen
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
          uv run --frozen mypy src
          uv run --frozen pytest -q
          uv run --frozen redot-compat schema export --check
      - name: Audit locked dependencies
        run: uv run --frozen pip-audit --format cyclonedx-json --output release/sbom.cdx.json
      - name: Build and record local release evidence
        run: |
          uv run --frozen python -m build
          uv run --frozen python scripts/release_audit.py --output release
      - name: Upload dry-run artifacts only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run-${{ github.ref_name }}
          path: |
            dist/
            release/
            schemas/
            LICENSE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
